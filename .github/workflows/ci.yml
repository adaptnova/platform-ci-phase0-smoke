name: Phase0 Smoke CI
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "public-hosted-ok"
  selfhosted:
    runs-on:
      - self-hosted
      - linux
      - x64
      - nova-cf-ci
    timeout-minutes: 10
    steps:
      - run: echo "phase0-selfhosted-ok host=$(hostname)"
      - run: uname -a
